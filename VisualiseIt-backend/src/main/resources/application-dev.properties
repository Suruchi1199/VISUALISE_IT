# Local development profile: use MySQL for dev as well (configure via environment variables if needed)
# Defaults point to a local MySQL instance; do NOT commit real passwords here — set SPRING_DATASOURCE_PASSWORD in your environment.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/educate_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# H2 console removed for dev since MySQL is used by default in dev profile now
